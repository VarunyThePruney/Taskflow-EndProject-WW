<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a17">
  <meta name="description" content="A calm, clear place to plan your work.">
  <title>Taskflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon sprite: every icon in the app is referenced from here with <use href="#i-name"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
      <symbol id="i-board" viewBox="0 0 24 24"><rect x="3.5" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="16.5" y="4" width="4" height="13" rx="1.5"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9M4 12h4M14 12h6"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/><circle cx="11" cy="12" r="2"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 11v5.5M14.5 11v5.5M6.5 7l.8 11.2a1 1 0 0 0 1 .8h7.4a1 1 0 0 0 1-.8L17.5 7M9 7V4.5h6V7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8 12 3.5z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-filter-off" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8L4 5zM3 3l18 18"/></symbol>
    </defs>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <a class="brand" href="#" aria-label="Taskflow">
        <svg class="brand-mark" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><rect x="1" y="4" width="26" height="5.5" rx="2.75" fill="#9cac92"/><rect x="1" y="11.25" width="18" height="5.5" rx="2.75" fill="#d2a46c"/><rect x="1" y="18.5" width="10" height="5.5" rx="2.75" fill="#87b192"/></svg>
        <span>taskflow</span>
      </a>

      <button class="side-create" id="newTask" type="button">
        <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-plus"/></svg>
        <span>New task</span><kbd>N</kbd>
      </button>


      <section class="side-section" aria-label="Projects">
        <div class="side-heading">
          <h2 class="side-title">Projects</h2>
          <button class="icon-action" id="addProject" type="button" aria-label="Create project" title="Create project"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-plus"/></svg></button>
        </div>
        <div class="side-list" id="projectList"></div>
      </section>

      <div class="sidebar-bottom">
        <button class="side-item" id="settingsButton" type="button"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-sliders"/></svg><span class="side-label">Settings</span></button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main-content">
      <header class="topbar">
        <button class="topbar-btn" id="mobileMenu" type="button" aria-label="Open navigation"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <span class="topbar-brand">taskflow</span>
        <button class="topbar-btn topbar-add" id="introNewTask" type="button" aria-label="New task"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </header>

      <div class="content-wrap">
        <section class="hero" aria-label="Today">
          <p class="hero-date" id="dateLabel"></p>
          <h1 class="hero-title"><span class="hero-hello" id="heroHello">Hello.</span> <span class="hero-status" id="heroStatus">Let’s get started.</span></h1>

          <div class="flow" id="flow" role="group" aria-label="Tasks by status. Select a segment to filter the list.">
            <button class="flow-seg todo" type="button" data-filter="todo"><span class="flow-name">To do</span><span class="flow-count" id="totalTodo">0</span></button>
            <button class="flow-seg doing" type="button" data-filter="in-progress"><span class="flow-name">In progress</span><span class="flow-count" id="progressStat">0</span></button>
            <button class="flow-seg done" type="button" data-filter="completed"><span class="flow-name">Done</span><span class="flow-count" id="doneStat">0</span></button>
            <p class="flow-empty">Add a task and it shows up here.</p>
          </div>
          <div class="hero-foot">
            <p class="hero-summary" id="flowSummary"></p>
            <button class="next-up hidden" id="nextUp" type="button"></button>
          </div>
        </section>

        <section class="work" aria-label="Tasks">
          <div class="work-head">
            <div class="work-title"><h2 id="listTitle">Everything</h2><span class="task-total" id="listCount">0 tasks</span></div>
            <div class="view-switch" role="group" aria-label="Layout">
              <button class="view-btn active" id="viewListBtn" type="button" data-view-mode="list" aria-pressed="true"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-list"/></svg><span>List</span></button>
              <button class="view-btn" id="viewBoardBtn" type="button" data-view-mode="board" aria-pressed="false"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-board"/></svg><span>Board</span></button>
            </div>
          </div>

          <form class="quick-add" id="quickAdd" autocomplete="off">
            <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-plus"/></svg>
            <input id="quickInput" type="text" maxlength="120" placeholder="Add a task and press Enter" aria-label="Quick add a task">
            <button class="quick-submit" type="submit">Add</button>
          </form>

          <div class="controls">
            <div class="filter-row" role="group" aria-label="Filter by status">
              <button class="filter-btn active" type="button" data-filter="all">Everything <span id="filterAllCount">0</span></button>
              <button class="filter-btn" type="button" data-filter="todo">To do <span id="filterTodoCount">0</span></button>
              <button class="filter-btn" type="button" data-filter="in-progress">In progress <span id="filterProgressCount">0</span></button>
              <button class="filter-btn" type="button" data-filter="completed">Done <span id="filterDoneCount">0</span></button>
            </div>
            <div class="tools">
              <label class="search-box"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="Search" aria-label="Search tasks" title="Press / to search"></label>
              <select id="priorityFilter" aria-label="Filter by priority"><option value="all">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
              <select id="sortSelect" aria-label="Sort tasks"><option value="due-asc">Due date, soonest</option><option value="due-desc">Due date, latest</option><option value="created-desc">Recently added</option><option value="priority">Priority</option><option value="manual">Manual order</option></select>
            </div>
          </div>

          
  <script src="app.js"></script>
</body>
</html>
